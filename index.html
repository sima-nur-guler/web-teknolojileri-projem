<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap | Sima Nur GÜLER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background: linear-gradient(135deg, #0D1B2A 0%, #1B263B 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(224, 225, 221, 0.2); color: white; }
        .form-control:focus { background-color: rgba(255, 255, 255, 0.1); color: white; border-color: #E0E1DD; box-shadow: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card login-card p-4 shadow-lg rounded-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle" style="font-size: 3rem; color: #E0E1DD;"></i>
                        <h3 class="mt-2" style="color: #E0E1DD;">Sisteme Giriş</h3>
                    </div>
                    
                    <div id="hataMesaji" class="alert alert-danger text-center small py-2 d-none" style="background-color: rgba(220, 53, 69, 0.8); color: white; border: none;">
                        <i class="bi bi-exclamation-triangle-fill"></i> Kullanıcı adı veya şifre hatalı!
                    </div>
                    
                    <form action="login.php" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-silver small fw-bold">Öğrenci Numarası</label>
                            <input type="text" name="kullaniciadi" class="form-control bg-transparent text-white" placeholder="b251210098" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-silver small fw-bold">Parola</label>
                            <input type="password" name="password" class="form-control bg-transparent text-white" required>
                        </div>
                        <button type="submit" class="btn btn-outline-light w-100 fw-bold">Giriş Yap <i class="bi bi-box-arrow-in-right ms-1"></i></button>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('hata')) {
            document.getElementById('hataMesaji').classList.remove('d-none');
        }
    </script>
</body>
</html>
