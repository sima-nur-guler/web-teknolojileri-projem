<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap | Sima Nur GÜLER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: linear-gradient(135deg, #0D1B2A 0%, #1B263B 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(224, 225, 221, 0.2); color: white; }
    </style>
    
    <script>
        function girisKontrol() {
            // Formdaki bilgileri alıyoruz
            var kullanici = document.forms["loginFormu"]["kullaniciadi"].value;
            var sifre = document.forms["loginFormu"]["password"].value;

            // Kendi öğrenci numaranı ve şifreni buraya yazıyorsun
            var dogruKullanici = "b251210098"; 
            var dogruSifre = "sima123"; 

            // Bilgiler doğruysa hakkimda.html'e gönderiyoruz
            if (kullanici === dogruKullanici && sifre === dogruSifre) {
                alert("Giriş Başarılı! Hoş geldiniz.");
                window.location.href = "hakkimda.html"; 
                return false; 
            } else {
                alert("Kullanıcı adı veya şifre hatalı! Lütfen tekrar deneyiniz.");
                return false;
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card login-card p-4 shadow-lg rounded-4">
                    <h3 class="text-center mb-4" style="color: #E0E1DD;">Üye Girişi</h3>
                    
                    <form name="loginFormu" onsubmit="return girisKontrol()">
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı Adı(Öğrenci No):</label>
                            <input type="text" name="kullaniciadi" class="form-control bg-transparent text-white" placeholder="bXXXXXXXXX" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Şifre:</label>
                            <input type="password" name="password" class="form-control bg-transparent text-white" required>
                        </div>
                        <button type="submit" class="btn btn-outline-light w-100 mt-3">Giriş Yap</button>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</body>
</html>
