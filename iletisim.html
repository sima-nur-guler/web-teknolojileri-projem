<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İletişim | Sima Nur GÜLER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        function formKontrol() {
            var ad = document.forms["iletisimFormu"]["ad"].value;
            var email = document.forms["iletisimFormu"]["email"].value;
            var mesaj = document.forms["iletisimFormu"]["mesaj"].value;

            if (ad == "" || email == "" || mesaj == "") {
                alert("Lütfen tüm alanları doldurunuz!");
                return false;
            }
            if (email.indexOf("@") == -1) {
                alert("Geçersiz e-posta adresi!");
                return false;
            }
            return true;
        }
    </script>
</head>
<body class="bg-light">
    <!-- NAVBAR (Tüm Sayfalarda Ortak) -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #1B263B;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Sima Nur</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>

        <div class="collapse navbar-collapse" id="navbarNav">

                <!-- Ana Sayfaya Dönüş İçin Logo veya link zaten mevcut -->
            </ul>
        </div>
    </div>
  </nav>

    <div class="container mt-5">
        <h2 class="section-title text-center">Bana Ulaşın</h2>
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-4 rounded-4 shadow-sm">
                <form name="iletisimFormu" action="gonder.php" onsubmit="return formKontrol()" method="post">
                    <div class="mb-3">
                        <label class="form-label">Adınız Soyadınız:</label>
                        <input type="text" name="ad" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-posta Adresiniz:</label>
                        <input type="text" name="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mesajınız:</label>
                        <textarea name="mesaj" class="form-control" rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Gönder</button>
                    <button type="reset" class="btn btn-outline-secondary w-100 mt-2">Temizle</button>
                    <div class="text-center mt-4">
                      <a href="index.html" class="text-decoration-none text-secondary small">
                      <i class="bi bi-arrow-left"></i> Ana Sayfaya Dön
                      </a>
                    </div>
                </form>
            </div>
        </div>
